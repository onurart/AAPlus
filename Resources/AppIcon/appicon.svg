<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2B2F3A"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="pinGrad" x1="256" y1="58" x2="256" y2="454" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8C2D6"/>
    </linearGradient>
    <linearGradient id="accent" x1="184" y1="170" x2="332" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69E7FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle orbit glow -->
  <circle cx="256" cy="256" r="154" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="10"/>
  <circle cx="256" cy="256" r="118" stroke="#69E7FF" stroke-opacity="0.09" stroke-width="4"/>

  <!-- Pins around the core -->
  <g stroke="url(#pinGrad)" stroke-width="14" stroke-linecap="round" filter="url(#shadow)">
    <line x1="256" y1="74" x2="256" y2="170"/>
    <line x1="256" y1="342" x2="256" y2="438"/>
    <line x1="74" y1="256" x2="170" y2="256"/>
    <line x1="342" y1="256" x2="438" y2="256"/>
    <line x1="127" y1="127" x2="196" y2="196"/>
    <line x1="316" y1="316" x2="385" y2="385"/>
    <line x1="385" y1="127" x2="316" y2="196"/>
    <line x1="196" y1="316" x2="127" y2="385"/>
  </g>

  <!-- Pin heads -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="256" cy="68" r="11"/>
    <circle cx="256" cy="444" r="11"/>
    <circle cx="68" cy="256" r="11"/>
    <circle cx="444" cy="256" r="11"/>
    <circle cx="121" cy="121" r="10"/>
    <circle cx="391" cy="391" r="10"/>
    <circle cx="391" cy="121" r="10"/>
    <circle cx="121" cy="391" r="10"/>
  </g>

  <!-- Center core -->
  <circle cx="256" cy="256" r="82" fill="url(#accent)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="62" fill="#0B1020" fill-opacity="0.9"/>
  <circle cx="256" cy="256" r="48" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- aaplus word mark -->
  <text x="256" y="266" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800"
        fill="#FFFFFF" letter-spacing="-2">aa+</text>

  <!-- Small shine -->
  <path d="M203 190C219 174 239 166 263 166" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
</svg>
